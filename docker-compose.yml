
services:
  # PostgreSQL database for license server
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=janus
      - POSTGRES_PASSWORD=janus_dev_password
      - POSTGRES_DB=janus_license
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus_license"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - license

  # License server (for development/testing)
  license-server:
    build:
      context: .
      dockerfile: Dockerfile.license-server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - LICENSING_DATABASE_URL=postgres://janus:janus_dev_password@postgres:5432/janus_license?sslmode=disable
    ports:
      - "8443:8443"
    profiles:
      - dev
      - license

  # pgAdmin for database administration
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - dev
      - license

  golangci-lint:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Alternative service for running with specific flags
  golangci-lint-verbose:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run --verbose
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Service for fixing issues automatically
  golangci-lint-fix:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run --fix
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Integration test services using Janus CI image
  integration-tests:
    image: dukeofubuntu/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "Xvfb :99 -screen 0 1024x768x24 & sleep 2 && mage integration"
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - test

  # Unit tests in container
  unit-tests:
    image: dukeofubuntu/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: mage unit
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
    profiles:
      - test

  # All tests (unit + integration)
  all-tests:
    image: dukeofubuntu/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "Xvfb :99 -screen 0 1024x768x24 & sleep 2 && mage unit && mage integration"
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - test

  # Validation tests
  validation-tests:
    image: dukeofubuntu/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: mage validationAll
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - validation
volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
