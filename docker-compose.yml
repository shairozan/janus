
services:
  golangci-lint:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Alternative service for running with specific flags
  golangci-lint-verbose:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run --verbose
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Service for fixing issues automatically
  golangci-lint-fix:
    image: golangci/golangci-lint:v2.1.5-alpine
    volumes:
      - .:/app
    working_dir: /app
    command: golangci-lint run --fix
    environment:
      - GOOS=linux
      - GOARCH=amd64
    profiles:
      - lint

  # Integration test services using Janus CI image
  integration-tests:
    image: ghcr.io/shairozan/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "Xvfb :99 -screen 0 1024x768x24 & sleep 2 && mage integration"
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - test

  # Unit tests in container
  unit-tests:
    image: ghcr.io/shairozan/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: mage unit
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
    profiles:
      - test

  # All tests (unit + integration)
  all-tests:
    image: ghcr.io/shairozan/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "Xvfb :99 -screen 0 1024x768x24 & sleep 2 && mage unit && mage integration"
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - test

  # Validation tests
  validation-tests:
    image: ghcr.io/shairozan/janus-ci:latest-ubuntu24
    volumes:
      - .:/app
    working_dir: /app
    command: mage validationAll
    environment:
      - GOOS=linux
      - GOARCH=amd64
      - CGO_ENABLED=1
      - DISPLAY=:99
    profiles:
      - validation
