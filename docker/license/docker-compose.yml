version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus_password
      POSTGRES_DB: janus_license
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus_license"]
      interval: 10s
      timeout: 5s
      retries: 5

  license-server:
    build:
      context: ../..
      dockerfile: docker/license/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LICENSING_DATABASE_URL=postgres://janus:janus_password@postgres:5432/janus_license?sslmode=disable
      - LICENSING_ENCRYPTION_KEY=${LICENSING_ENCRYPTION_KEY:-CHANGE_ME_32_BYTE_KEY_FOR_AES256}
      - LICENSING_PORT=8080
    depends_on:
      postgres:
        condition: service_healthy
    command: ["serve", "--auto-migrate"]

volumes:
  postgres_data:
