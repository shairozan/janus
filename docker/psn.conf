; psn.conf for the Janus K8s bootstrap spike (issues #192 / #193).
;
; Registers two faked NONMEM "installations" so PsN can run without a real
; NONMEM or license. PsN finds nmfe<ver> under <path>/run/ ; both expose
; run/nmfe75 (version 7.5):
;   default -> mock nmfe that emits canned acop outputs (simulates a fit)
;   dummy   -> dummy compiler that exits without fitting (resample-only)
;
; Only [nm_versions] is overridden here; other PsN options use built-in defaults.
; If a given PsN version needs more keys, add them (the spike will surface this).

[nm_versions]
default=/opt/NONMEM/nm75,7.5
dummy=/opt/NONMEM/dummy,7.5
