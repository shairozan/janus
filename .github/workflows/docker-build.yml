name: Build Docker Images

on:
  workflow_dispatch:
    # Manual trigger - run this when you need to rebuild CI images
  schedule:
    # Rebuild images weekly on Sundays at 2 AM UTC to get latest Ubuntu updates
    - cron: '0 2 * * 0'

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ubuntu-version: "20"
            dockerfile: "docker/Dockerfile.ubuntu20"
            tag-suffix: "ubuntu20"
          - ubuntu-version: "22"
            dockerfile: "docker/Dockerfile.ubuntu22"
            tag-suffix: "ubuntu22"
          - ubuntu-version: "24"
            dockerfile: "docker/Dockerfile.ubuntu24"
            tag-suffix: "ubuntu24"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish to this repository's own GHCR namespace. GITHUB_TOKEN is issued
      # automatically to every run, so there is no credential to configure,
      # expire, or forget — which is what left these images unbuilt for months.
      # A fork publishes to its own namespace and needs nothing set up.
      - name: Determine registry namespace
        id: registry
        shell: bash
        run: |
          # GHCR rejects uppercase in image names; repository owners can contain it.
          echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.namespace }}/janus-ci
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.tag-suffix }}
            type=ref,event=pr,suffix=-${{ matrix.tag-suffix }}
            type=raw,value=${{ matrix.tag-suffix }},enable={{is_default_branch}}
            type=raw,value=latest-${{ matrix.tag-suffix }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Test image
        run: |
          # Use the first tag metadata-action actually produced rather than
          # assuming ":ubuntu22" exists. The bare suffix tags are gated on
          # is_default_branch, so dispatching this workflow from a topic branch
          # yields only "<branch>-ubuntu22" and a hardcoded reference would fail
          # to find an image that was just built successfully.
          IMAGE="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          echo "Testing $IMAGE ..."
          docker run --rm "$IMAGE" bash -c "
            echo '=== Testing Go Installation ==='
            go version
            echo '=== Testing GCC Installation ==='
            gcc --version
            echo '=== Testing GUI Dependencies ==='
            pkg-config --exists gl && echo 'OpenGL: OK' || echo 'OpenGL: MISSING'
            pkg-config --exists x11 && echo 'X11: OK' || echo 'X11: MISSING'
            echo '=== Testing Mage Installation ==='
            mage --version
            echo '=== Testing Xvfb ==='
            which Xvfb && echo 'Xvfb: OK' || echo 'Xvfb: MISSING'
            echo '=== All tests completed ==='
          "

  # Generate summary of built images
  summary:
    needs: build-images
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following Janus CI images were built and pushed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu Version | Docker Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-images.result }}" == "success" ]; then
            echo "| 20.04 | \`ghcr.io/${{ github.repository_owner }}/janus-ci:ubuntu20\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| 22.04 | \`ghcr.io/${{ github.repository_owner }}/janus-ci:ubuntu22\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| 24.04 | \`ghcr.io/${{ github.repository_owner }}/janus-ci:ubuntu24\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Usage in CI" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
            echo "jobs:" >> $GITHUB_STEP_SUMMARY
            echo "  test:" >> $GITHUB_STEP_SUMMARY
            echo "    container: ghcr.io/${{ github.repository_owner }}/janus-ci:ubuntu22" >> $GITHUB_STEP_SUMMARY
            echo "    runs-on: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "| All | - | ❌ Build Failed |" >> $GITHUB_STEP_SUMMARY
          fi