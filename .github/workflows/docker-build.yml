name: Build Docker Images

on:
  workflow_dispatch:
    # Manual trigger - run this when you need to rebuild CI images
  schedule:
    # Rebuild images weekly on Sundays at 2 AM UTC to get latest Ubuntu updates
    - cron: '0 2 * * 0'

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ubuntu-version: "20"
            dockerfile: "docker/Dockerfile.ubuntu20"
            tag-suffix: "ubuntu20"
          - ubuntu-version: "22"
            dockerfile: "docker/Dockerfile.ubuntu22"
            tag-suffix: "ubuntu22"
          - ubuntu-version: "24"
            dockerfile: "docker/Dockerfile.ubuntu24"
            tag-suffix: "ubuntu24"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Decide up front whether this run can publish. A fork cannot push to the
      # upstream namespace, and without this the workflow fails at login with
      # "Username and password required" — which reads as a broken workflow
      # rather than an absent credential. Building without pushing still proves
      # the Dockerfile works, which is the part a contributor needs.
      - name: Determine registry access
        id: registry
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "namespace=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub credentials are not configured - building the image without publishing it."
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "namespace=local" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.registry.outputs.push == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.namespace }}/janus-ci
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.tag-suffix }}
            type=ref,event=pr,suffix=-${{ matrix.tag-suffix }}
            type=raw,value=${{ matrix.tag-suffix }},enable={{is_default_branch}}
            type=raw,value=latest-${{ matrix.tag-suffix }},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ steps.registry.outputs.push == 'true' && github.event_name != 'pull_request' }}
          load: ${{ steps.registry.outputs.push != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Test image
        run: |
          echo "Testing ${{ matrix.tag-suffix }} image..."
          docker run --rm ${{ steps.registry.outputs.namespace }}/janus-ci:${{ matrix.tag-suffix }} bash -c "
            echo '=== Testing Go Installation ==='
            go version
            echo '=== Testing GCC Installation ==='
            gcc --version
            echo '=== Testing GUI Dependencies ==='
            pkg-config --exists gl && echo 'OpenGL: OK' || echo 'OpenGL: MISSING'
            pkg-config --exists x11 && echo 'X11: OK' || echo 'X11: MISSING'
            echo '=== Testing Mage Installation ==='
            mage --version
            echo '=== Testing Xvfb ==='
            which Xvfb && echo 'Xvfb: OK' || echo 'Xvfb: MISSING'
            echo '=== All tests completed ==='
          "

  # Generate summary of built images
  summary:
    needs: build-images
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following Janus CI images were built and pushed:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Ubuntu Version | Docker Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-images.result }}" == "success" ]; then
            echo "| 20.04 | \`${{ secrets.DOCKERHUB_USERNAME || 'your-namespace' }}/janus-ci:ubuntu20\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| 22.04 | \`${{ secrets.DOCKERHUB_USERNAME || 'your-namespace' }}/janus-ci:ubuntu22\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| 24.04 | \`${{ secrets.DOCKERHUB_USERNAME || 'your-namespace' }}/janus-ci:ubuntu24\` | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 Usage in CI" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
            echo "jobs:" >> $GITHUB_STEP_SUMMARY
            echo "  test:" >> $GITHUB_STEP_SUMMARY
            echo "    container: ${{ secrets.DOCKERHUB_USERNAME || 'your-namespace' }}/janus-ci:ubuntu22" >> $GITHUB_STEP_SUMMARY
            echo "    runs-on: ubuntu-latest" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "| All | - | ❌ Build Failed |" >> $GITHUB_STEP_SUMMARY
          fi