name: Tests

on:
  workflow_call:
    # This workflow is only called by other workflows (ci.yml, release.yml)
    # It does not run independently on push/PR to avoid duplication

permissions:
  contents: read

jobs:
  # Test Janus GUI in parallel with license-server
  test-janus:
    runs-on: ubuntu-latest
    container: dukeofubuntu/janus-ci:ubuntu22
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dependencies
        run: go mod download

      - name: Setup license public key
        uses: ./.github/actions/setup-license-key
        with:
          license-public-key: ${{ secrets.LICENSE_PUBLIC_KEY }}

      - name: Start virtual display for GUI tests
        shell: bash
        run: |
          echo "Starting Xvfb for GUI tests..."
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          echo "Virtual display started on :99"

      - name: Run unit tests
        shell: bash
        run: |
          echo "Running Janus GUI unit tests (no external dependencies)..."
          mage unit

      - name: Run integration tests
        shell: bash
        run: |
          echo "Running Janus GUI integration tests (with external dependencies)..."
          echo "These tests use mock binaries and HTTP servers to simulate external tools"
          mage integration

      - name: Run linting
        shell: bash
        run: |
          echo "Running linters..."
          mage lintDocker || echo "⚠️ Linting completed with warnings (check logs above)"

  # Test license-server in parallel
  test-license-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: janus
          POSTGRES_PASSWORD: janus_test_password
          POSTGRES_DB: janus_license_test
        options: >-
          --health-cmd "pg_isready -U janus -d janus_license_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Download dependencies
        run: go mod download

      - name: Run license-server unit tests
        shell: bash
        run: |
          echo "🧪 Running license-server unit tests (no external dependencies)..."
          go test -v -race -tags=unit ./internal/license/... ./cmd/license-server/...

      - name: Run database migrations
        shell: bash
        run: |
          echo "🔧 Running database migrations..."
          go run ./cmd/license-server migrate up --database-url "postgres://janus:janus_test_password@localhost:5432/janus_license_test?sslmode=disable"

      - name: Run license-server integration tests
        shell: bash
        env:
          LICENSING_DATABASE_URL: "postgres://janus:janus_test_password@localhost:5432/janus_license_test?sslmode=disable"
          LICENSING_ENCRYPTION_KEY: "Wp7G9y+RHAu2QYivFK9jOWZKRs+p7J6Y"
        run: |
          echo "🧪 Running license-server integration tests (with PostgreSQL)..."
          go test -v -timeout 60s -tags="integration,server" ./internal/license/... ./cmd/license-server/...

      - name: Build license-server
        shell: bash
        run: |
          echo "🔨 Building license-server to verify compilation..."
          go build -o license-server ./cmd/license-server

  # Combined status check
  test:
    runs-on: ubuntu-latest
    needs: [test-janus, test-license-server]
    steps:
      - name: All tests passed
        run: echo "✅ All Janus and license-server tests passed!"