name: Tests

on:
  workflow_call:
    # This workflow is only called by other workflows (ci.yml, release.yml)
    # It does not run independently on push/PR to avoid duplication

permissions:
  contents: read

jobs:
  # Test Janus GUI
  test-janus:
    runs-on: ubuntu-latest
    container: ghcr.io/shairozan/janus-ci:ubuntu22
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dependencies
        run: go mod download

      - name: Start virtual display for GUI tests
        shell: bash
        run: |
          echo "Starting Xvfb for GUI tests..."
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 2
          echo "Virtual display started on :99"

      - name: Run unit tests
        shell: bash
        run: |
          echo "Running Janus GUI unit tests (no external dependencies)..."
          mage unit

      - name: Run integration tests
        shell: bash
        run: |
          echo "Running Janus GUI integration tests (with external dependencies)..."
          echo "These tests use mock binaries and HTTP servers to simulate external tools"
          mage integration

      - name: Run linting
        shell: bash
        run: |
          echo "Running linters..."
          mage lintDocker || echo "⚠️ Linting completed with warnings (check logs above)"

  # Combined status check
  test:
    runs-on: ubuntu-latest
    needs: [test-janus]
    steps:
      - name: All tests passed
        run: echo "✅ All Janus tests passed!"