# Non-hermetic integration E2E (#150): the REAL portal + REAL license-server +
# REAL Postgres, with only the true externals faked (a mock OIDC issuer). This
# exercises the joints the hermetic Playwright suite mocks away — token
# validation, ResolveOrgUser, JSON shapes, route registration.
#
# Run (from repo root):
#   GITHUB_TOKEN=<token-with-hermes-read> \
#   docker compose -f docker-compose.integration.yml up --build --abort-on-container-exit --exit-code-from playwright
#
# The `playwright` service's exit code is the suite result.

name: janus-integration

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: janus
      POSTGRES_PASSWORD: janus
      POSTGRES_DB: janus_license
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U janus -d janus_license"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Mock OIDC issuer — serves discovery + JWKS + authorize/token/refresh, and
  # stamps `token_use: access` onto the tokens the license-server validates.
  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG_PATH: /config/config.json
      SERVER_PORT: "8080"
    volumes:
      - ./test/integration/oidc:/config:ro

  # The mock-oauth2-server image is distroless (no shell/wget), so it can't be
  # healthchecked directly. This tiny job polls its discovery endpoint and exits
  # once it's serving; dependents gate on it completing.
  oidc-ready:
    image: alpine:3.20
    depends_on:
      oidc:
        condition: service_started
    command:
      - sh
      - -c
      - |
        echo "waiting for oidc discovery..."
        until wget -q -O /dev/null http://oidc:8080/default/.well-known/openid-configuration; do sleep 2; done
        echo "oidc ready"

  # Real license-server built from source. Auto-migrates on boot. Stripe/Cognito
  # -admin/Mailgun/Redis are left unset (the server disables those routes).
  license-server:
    build:
      context: .
      dockerfile: test/integration/Dockerfile.license-server
    environment:
      LICENSING_DATABASE_URL: postgres://janus:janus@postgres:5432/janus_license?sslmode=disable
      LICENSING_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef" # exactly 32 bytes (test only)
      LICENSING_OIDC_ISSUER: http://oidc:8080/default
      LICENSING_OIDC_CLIENT_ID: integration-client
      LICENSING_OIDC_ALLOWED_DOMAINS: example.test
      LICENSING_PORT: "8080"
      LICENSING_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      oidc-ready:
        condition: service_completed_successfully

  # Seeds the org + customer-admin user once migrations have created the tables.
  # (The license-server image is FROM scratch, so we can't healthcheck it; we
  # poll for the org_users table as the readiness signal instead.)
  seed:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: janus
      PGPASSWORD: janus
      PGDATABASE: janus_license
    volumes:
      - ./test/integration/seed.sql:/seed.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      license-server:
        condition: service_started
    command:
      - sh
      - -c
      - |
        echo "waiting for license-server migrations (org_users table)..."
        until [ "$$(psql -tAc "select to_regclass('public.org_users')" | tr -d '[:space:]')" = "org_users" ]; do sleep 2; done
        echo "seeding org + user..."
        psql -v ON_ERROR_STOP=1 -f /seed.sql
        echo "seed complete"

  # Real portal (Next standalone). BFF → license-server; Auth.js → mock OIDC.
  portal:
    build:
      context: ./web/portal
      dockerfile: ../../docker/portal/Dockerfile
    environment:
      AUTH_SECRET: integration-only-secret-do-not-use-0000=
      AUTH_URL: http://portal:3000
      AUTH_TRUST_HOST: "true"
      LICENSE_SERVER_URL: http://license-server:8080
      AUTH_COGNITO_ID: integration-client
      AUTH_COGNITO_SECRET: integration-secret
      AUTH_COGNITO_ISSUER: http://oidc:8080/default
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      license-server:
        condition: service_started
      oidc-ready:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 4s
      retries: 30

  # Playwright drives the real portal UI. Reuses the portal project's installed
  # @playwright/test; runs the integration config/specs.
  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    working_dir: /work/web/portal
    environment:
      CI: "1"
      PORTAL_URL: http://portal:3000
      OIDC_URL: http://oidc:8080
    volumes:
      - ./:/work
      - integration_node_modules:/work/web/portal/node_modules
      - integration_next:/work/web/portal/.next
    depends_on:
      portal:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    command:
      - bash
      - -lc
      - |
        set -e
        corepack enable
        pnpm install --frozen-lockfile
        pnpm exec playwright test --config ../../test/integration/playwright.config.ts

volumes:
  integration_node_modules:
  integration_next:
