# SOPS configuration for deploy/ secrets.
#
# Run sops from within deploy/ (or a subdirectory) so this file is discovered.
# Replace the placeholder AGE recipient below with your real public key
# (`age-keygen` prints `Public key: age1...`). Multiple recipients may be listed
# comma-separated so several operators can decrypt.
#
# Only the data/stringData values of the secret are encrypted; YAML keys and
# structure stay readable in git for diffing.

creation_rules:
  # Covers app secrets (license-server/secrets/) and platform secrets (platform/).
  - path_regex: .*\.sops\.ya?ml$
    encrypted_regex: "^(data|stringData)$"
    age: >-
      age14ywlc408mw4w063s097prew9kkq5mphk82a9yvx6l4f0uu8ljusq4c2zmq