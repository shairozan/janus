apiVersion: v1
kind: Service
metadata:
  name: license-server
  labels:
    app.kubernetes.io/name: license-server
  annotations:
    # Container-native load balancing: expose pod IPs as a NEG so the GCE Ingress
    # load-balances directly to pods (no kube-proxy hop).
    cloud.google.com/neg: '{"ingress": true}'
    # Attach the health-check / timeout policy for the Ingress backend.
    cloud.google.com/backend-config: '{"default": "license-server-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: license-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
