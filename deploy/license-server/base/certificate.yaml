# cert-manager Certificate for the license server. cert-manager solves the DNS-01
# challenge via Cloudflare and writes the resulting cert/key into the Secret named
# below, which the Ingress references via spec.tls[].secretName.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: license-server-tls
  labels:
    app.kubernetes.io/name: license-server
spec:
  secretName: license-server-tls
  dnsNames:
    - licenses.januspk.com
  issuerRef:
    name: letsencrypt-prod # switch to letsencrypt-staging while testing
    kind: Issuer
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
