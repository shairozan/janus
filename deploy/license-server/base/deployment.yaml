apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-server
  labels:
    app.kubernetes.io/name: license-server
spec:
  # Single replica: the server auto-applies DB migrations on startup and performs
  # key generation/rotation. One replica avoids migration races and keeps key
  # operations serialized. The workload is low-traffic.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: license-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-server
    spec:
      # ghcr.io pull credentials (dockerconfigjson). imagePullSecrets are
      # namespace-scoped, so this Secret must exist in janus-license — a pull secret
      # in another namespace cannot be reused here.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: license-server
          image: janus-license-server # overridden by overlay (images:)
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: license-server-config
            - secretRef:
                name: license-server-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
