apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: license-server
  labels:
    app.kubernetes.io/name: license-server
  annotations:
    # External GCE (GCLB) Ingress. No reserved static IP: external-dns publishes the
    # record to whatever address the LB is assigned.
    kubernetes.io/ingress.class: "gce"
    # external-dns (cluster-wide) creates/updates this hostname in Cloudflare,
    # pointing at the Ingress load-balancer address.
    external-dns.alpha.kubernetes.io/hostname: "licenses.januspk.com"
    # Redirect HTTP->HTTPS at the load balancer.
    networking.gke.io/v1beta1.FrontendConfig: "license-server-frontendconfig"
spec:
  # TLS material is issued by cert-manager (DNS-01 via Cloudflare) into this Secret;
  # the GCE Ingress provisions an LB SSL certificate from it.
  tls:
    - hosts:
        - licenses.januspk.com
      secretName: license-server-tls
  rules:
    - host: licenses.januspk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: license-server
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: license-server-frontendconfig
  labels:
    app.kubernetes.io/name: license-server
spec:
  redirectToHttps:
    enabled: true
