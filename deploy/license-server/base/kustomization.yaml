apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the Janus license server. The SOPS-encrypted Secrets are decrypted
# and injected by the KSOPS generator in the gke overlay (not here), so the base stays
# free of secret material and reusable. See deploy/README.md.

namespace: janus-license

commonLabels:
  app.kubernetes.io/part-of: janus-license

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - backendconfig.yaml
  - issuer.yaml
  - certificate.yaml
  - ingress.yaml
  - postgres.yaml
  - redis.yaml
