apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: license-server-backendconfig
  labels:
    app.kubernetes.io/name: license-server
spec:
  # The default GCE Ingress health check probes "/" and expects 200; our app serves
  # health at /health. Point the LB health check there.
  healthCheck:
    type: HTTP
    requestPath: /health
    port: 8080
  timeoutSec: 30
