# Namespaced cert-manager Issuers (live in janus-license, per "cert manager in the
# namespace"). Both use the Let's Encrypt ACME DNS-01 challenge solved via the
# Cloudflare API, so no inbound reachability is required to issue the cert.
#
# Requires: cert-manager installed cluster-wide (see deploy/platform/README.md) and a
# Cloudflare API token Secret named "cloudflare-api-token" in this namespace (key
# "api-token"), provided via SOPS (see secrets/cloudflare-api-token.example.yaml).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: license-server
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@januspk.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - januspk.com
---
# Staging issuer for testing the pipeline without hitting LE rate limits. Point the
# Certificate's issuerRef at this name while validating, then switch back to prod.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/name: license-server
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@januspk.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - januspk.com
