apiVersion: v1
kind: Service
metadata:
  name: license-redis
  labels:
    app.kubernetes.io/name: license-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: license-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-redis
  labels:
    app.kubernetes.io/name: license-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: license-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-redis
    spec:
      securityContext:
        # redis:7-alpine runs as uid 999 (redis).
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # redis:7-alpine writes its pid file to /tmp; a tmpfs satisfies
        # readOnlyRootFilesystem without needing a PVC.
        - name: tmp
          emptyDir: {}
