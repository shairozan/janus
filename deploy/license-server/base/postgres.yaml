apiVersion: v1
kind: Service
metadata:
  name: license-postgres
  labels:
    app.kubernetes.io/name: license-postgres
spec:
  # Headless service: stable DNS for the StatefulSet pod
  # (license-postgres.<ns>.svc.cluster.local).
  clusterIP: None
  selector:
    app.kubernetes.io/name: license-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: license-postgres
  labels:
    app.kubernetes.io/name: license-postgres
spec:
  serviceName: license-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: license-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: license-postgres
    spec:
      securityContext:
        # postgres:16-alpine runs as uid 70 (postgres). fsGroup lets it own the PVC.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: license-server-config
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: license-server-config
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: license-server-secrets
                  key: POSTGRES_PASSWORD
            # Keep PGDATA in a subdirectory so the volume root (which may contain
            # lost+found) does not collide with initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # GKE default StorageClass (standard-rwo / balanced PD). Override per cluster
        # in the overlay if you use a different class.
        resources:
          requests:
            storage: 10Gi
