apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GKE overlay. Set the real image here so the base stays registry-agnostic.

resources:
  - ../../base
  # Cloudflare external-dns for januspk.com, in janus-license (reuses cloudflare-api-token).
  - external-dns.yaml

# Decrypt + emit the committed SOPS secrets as part of the build (KSOPS).
generators:
  - secret-generator.yaml

patches:
  - path: oidc-config-patch.yaml

images:
  - name: janus-license-server
    # Built by CI and published to GHCR (nested package path).
    newName: ghcr.io/pharmalytica/janus/license-server
    newTag: latest

