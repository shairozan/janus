apiVersion: v1
kind: ConfigMap
metadata:
  name: license-server-config
data:
  # Cognito User Pool for this environment. Neither value is a secret —
  # the issuer is a public OIDC discovery URL, and the client ID is
  # embedded in every access token.
  LICENSING_OIDC_ISSUER: "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_vFpMlzcTG"
  LICENSING_OIDC_CLIENT_ID: "5bia4s403t7c8eimvu6ji9t9fo"

  # Email domains allowed to access the admin API.
  LICENSING_OIDC_ALLOWED_DOMAINS: "knomix.io"

  # Cognito user pool for admin provisioning. Setting region + pool id flips
  # HasCognitoAdmin() true, which registers the customer-admin /orgs/{id}/*
  # routes. None of these are secret (the pool id is already in the issuer
  # above; an ARN is not sensitive). Read-only admin endpoints (members,
  # requests, rules, agreements, activity) need no AWS credentials — they only
  # touch the DB. The provisioning routes (promote/demote/offboard/SSO) sign an
  # STS AssumeRole with the IAM user in the Secret, then act as this role.
  LICENSING_AWS_REGION: "us-east-2"
  LICENSING_COGNITO_USER_POOL_ID: "us-east-2_vFpMlzcTG"
  LICENSING_AWS_ROLE_ARN: "arn:aws:iam::522029196570:role/JanusProdAdminRole"

  # In-cluster Redis service for the UserInfo write-through cache.
  LICENSING_REDIS_URL: "redis://license-redis:6379/0"
