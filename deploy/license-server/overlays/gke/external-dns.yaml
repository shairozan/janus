# Cloudflare external-dns instance for the januspk.com zone, running in janus-license
# and reusing the cloudflare-api-token Secret already in this namespace (the same token
# cert-manager uses for DNS-01).
#
# Why a dedicated instance: external-dns supports ONE provider per process. The existing
# `norns` instance is provider=digitalocean / domain-filter=norns.io and cannot manage
# Cloudflare. This instance is scoped to januspk.com with a distinct txt-owner-id so the
# two never touch each other's records.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: janus-license
  labels:
    app.kubernetes.io/name: external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: janus-external-dns
  labels:
    app.kubernetes.io/name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: janus-external-dns
  labels:
    app.kubernetes.io/name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: janus-external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: janus-license
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: janus-license
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            - --source=ingress
            - --provider=cloudflare
            - --domain-filter=januspk.com
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=janus-gke
            - --log-level=info
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: api-token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
