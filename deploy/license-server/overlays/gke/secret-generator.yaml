# KSOPS generator: decrypts the committed SOPS secrets at `kustomize build` time and
# emits them as part of the manifest stream. Requires the ksops exec plugin on PATH and
# building with `kustomize build --enable-alpha-plugins --enable-exec` (see Makefile).
# The AGE private key must be available to sops (SOPS_AGE_KEY_FILE or the default
# ~/.config/sops/age/keys.txt).
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: license-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ../../secrets/license-secrets.sops.yaml
  - ../../secrets/cloudflare-api-token.sops.yaml
  - ../../secrets/ghcr-pull.sops.yaml
