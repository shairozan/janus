# ghcr.io image pull secret for the janus-license namespace.
#
# Easiest way to produce the encrypted version (lets kubectl build the dockerconfigjson
# for you, then SOPS-encrypt it):
#
#   cd deploy
#   kubectl create secret docker-registry ghcr-pull \
#     --namespace janus-license \
#     --docker-server=ghcr.io \
#     --docker-username=<github-username> \
#     --docker-password=<github-PAT-with-read:packages> \
#     --dry-run=client -o yaml \
#     > license-server/secrets/ghcr-pull.sops.yaml
#   sops --encrypt --in-place license-server/secrets/ghcr-pull.sops.yaml
#
# The PAT only needs the `read:packages` scope. If the package is public you don't need
# a pull secret at all — remove imagePullSecrets from the Deployment in that case.
#
# This template shows the equivalent shape (stringData so SOPS encrypts the JSON):
apiVersion: v1
kind: Secret
metadata:
    name: ghcr-pull
    namespace: janus-license
    labels:
        app.kubernetes.io/name: license-server
type: kubernetes.io/dockerconfigjson
