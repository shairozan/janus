# Template for the license-server Secret. DO NOT put real values here or commit
# this file with secrets. Copy it to license-secrets.sops.yaml and encrypt:
#
#   cd deploy
#   cp license-server/secrets/license-secrets.example.yaml \
#      license-server/secrets/license-secrets.sops.yaml
#   # fill in real values, then:
#   sops --encrypt --in-place license-server/secrets/license-secrets.sops.yaml
#
# Generate the values:
#   ENCRYPTION_KEY : exactly 32 bytes, e.g.  openssl rand -base64 24   (24 raw bytes -> 32 base64 chars)
#   POSTGRES_PASSWORD : e.g.                 openssl rand -base64 24
#   DATABASE_URL : points at the in-cluster Postgres service and embeds the password.
apiVersion: v1
kind: Secret
metadata:
  name: license-server-secrets
  namespace: janus-license
  labels:
    app.kubernetes.io/name: license-server
type: Opaque
stringData:
  # Must be EXACTLY 32 bytes (the server rejects any other length).
  LICENSING_ENCRYPTION_KEY: "REPLACE_WITH_32_BYTE_KEY________"

  # Password for the in-cluster postgres StatefulSet. Must match the password in
  # LICENSING_DATABASE_URL below.
  POSTGRES_PASSWORD: "REPLACE_WITH_DB_PASSWORD"

  # DSN for the in-cluster Postgres (headless service name: license-postgres).
  # User/db come from the ConfigMap (janus / janus_license).
  LICENSING_DATABASE_URL: "postgres://janus:REPLACE_WITH_DB_PASSWORD@license-postgres:5432/janus_license?sslmode=disable"

  # IAM user that assumes the Cognito role (GKE has no AWS instance profile).
  # This user needs ONLY sts:AssumeRole on LICENSING_AWS_ROLE_ARN (set in the
  # ConfigMap); the Cognito permissions live on the assumed role, not the user.
  LICENSING_AWS_ACCESS_KEY_ID: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  LICENSING_AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"
