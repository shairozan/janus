# Cloudflare API token for cert-manager's DNS-01 solver (in the janus-license
# namespace). Copy to cloudflare-api-token.sops.yaml, fill the token, and encrypt:
#
#   cd deploy
#   cp license-server/secrets/cloudflare-api-token.example.yaml \
#      license-server/secrets/cloudflare-api-token.sops.yaml
#   # paste the token, then:
#   sops --encrypt --in-place license-server/secrets/cloudflare-api-token.sops.yaml
#
# Create the token in Cloudflare with permissions scoped to januspk.com:
#   Zone : Zone     : Read
#   Zone : DNS      : Edit
# (external-dns uses a copy of the SAME token in its own namespace — see
#  deploy/platform/external-dns/.)
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: janus-license
  labels:
    app.kubernetes.io/name: license-server
type: Opaque
stringData:
  api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
