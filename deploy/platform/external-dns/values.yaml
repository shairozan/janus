# Helm values for external-dns (chart: oci://registry-1.docker.io/bitnamicharts/external-dns
# or the kubernetes-sigs chart). Cluster-wide install managing the januspk.com zone in
# Cloudflare. external-dns watches Ingress resources and publishes their hostnames to
# whatever address the load balancer is assigned — so no static IP is needed.

provider: cloudflare

# Only manage records in this zone.
domainFilters:
  - januspk.com

# Watch Ingress (and optionally Service) resources for hostnames.
sources:
  - ingress

# Reconcile fully (create + delete records this instance owns).
policy: sync
registry: txt
txtOwnerId: janus-gke

# Read the Cloudflare API token from a Secret in external-dns's namespace.
# (kubernetes-sigs chart key shown; for the Bitnami chart use cloudflare.secretName.)
cloudflare:
  secretName: cloudflare-api-token
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

# Use DNS-only (gray cloud) so external-dns manages plain A/AAAA records; the GCE LB
# handles TLS. Proxying (orange cloud) would hide the origin IP from the cert flow.
cloudflareProxied: false
