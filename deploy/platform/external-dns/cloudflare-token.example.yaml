# Cloudflare API token for external-dns, in external-dns's own namespace.
# This is the SAME token value as the cert-manager one in janus-license — external-dns
# and cert-manager run in different namespaces, so each needs its own copy.
#
# Copy to cloudflare-token.sops.yaml, set the namespace to wherever external-dns runs,
# fill the token, and encrypt:
#
#   cd deploy
#   cp platform/external-dns/cloudflare-token.example.yaml \
#      platform/external-dns/cloudflare-token.sops.yaml
#   sops --encrypt --in-place platform/external-dns/cloudflare-token.sops.yaml
#
# Apply with:  sops --decrypt platform/external-dns/cloudflare-token.sops.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: external-dns # set to the namespace where external-dns is installed
type: Opaque
stringData:
  api-token: "REPLACE_WITH_CLOUDFLARE_API_TOKEN"
