# Template for the portal Secret. DO NOT put real values here or commit this file
# with secrets. Copy it to portal-secrets.sops.yaml and encrypt:
#
#   cd deploy
#   cp portal/secrets/portal-secrets.example.yaml \
#      portal/secrets/portal-secrets.sops.yaml
#   # fill in real values, then:
#   sops --encrypt --in-place portal/secrets/portal-secrets.sops.yaml
#
# Generate the values:
#   AUTH_SECRET          : openssl rand -base64 32   (Auth.js session encryption key)
#   AUTH_COGNITO_SECRET  : the portal's Cognito app-client secret (confidential client)
apiVersion: v1
kind: Secret
metadata:
  name: portal-secrets
  namespace: janus-license
  labels:
    app.kubernetes.io/name: portal
type: Opaque
stringData:
  # Auth.js session encryption secret (encrypts the session JWT cookie).
  AUTH_SECRET: "REPLACE_WITH_AUTH_SECRET"

  # The portal is a CONFIDENTIAL Cognito OAuth client — this is its client secret.
  # (The client id is non-secret and lives in the ConfigMap as AUTH_COGNITO_ID.)
  AUTH_COGNITO_SECRET: "REPLACE_WITH_COGNITO_APP_CLIENT_SECRET"
