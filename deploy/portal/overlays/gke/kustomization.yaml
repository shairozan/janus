apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# GKE overlay for the portal. Set the real image here so the base stays
# registry-agnostic. external-dns is NOT redeployed here — the cluster-wide
# januspk.com instance (shipped with the license-server overlay) already manages
# app.januspk.com.

resources:
  - ../../base

# Decrypt + emit the committed SOPS secrets as part of the build (KSOPS).
generators:
  - secret-generator.yaml

patches:
  - path: portal-config-patch.yaml

images:
  - name: janus-portal
    # Built by CI and published to GHCR (nested package path).
    newName: ghcr.io/pharmalytica/janus/portal
    newTag: latest
