apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
data:
  # The portal's public origin. Auth.js builds OAuth redirect URLs from this, so
  # it MUST match the hostname on the Ingress/Certificate (app.januspk.com).
  AUTH_URL: "https://app.januspk.com"

  # Cognito app client for the portal. The id is non-secret (embedded in every
  # token); the matching client secret is in the SOPS Secret (AUTH_COGNITO_SECRET).
  AUTH_COGNITO_ID: "5bia4s403t7c8eimvu6ji9t9fo"
  AUTH_COGNITO_ISSUER: "https://cognito-idp.us-east-2.amazonaws.com/us-east-2_vFpMlzcTG"

  # In-cluster URL of the license-server the BFF proxies to. The license-server
  # Service is "license-server" (port 80) in the janus-license namespace; reach it
  # across namespaces by its fully-qualified cluster DNS name.
  LICENSE_SERVER_URL: "http://license-server.janus-license.svc.cluster.local"
