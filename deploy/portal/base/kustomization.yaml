apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests for the Janus management portal. The portal is COLOCATED with the
# license-server in the janus-license namespace and reuses the resources the
# license-server deploy already provides there: the namespace, the cert-manager
# Issuers (letsencrypt-prod/-staging), the cloudflare-api-token Secret, the
# ghcr-pull image-pull Secret, and the cluster-wide external-dns. Only the portal's
# own Certificate, Deployment, Service, Ingress, ConfigMap, and Secret live here.
#
# The SOPS-encrypted portal Secret is decrypted and injected by the KSOPS generator
# in the gke overlay (not here), so the base stays free of secret material.

namespace: janus-license

commonLabels:
  app.kubernetes.io/part-of: janus-license

resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - backendconfig.yaml
  - certificate.yaml
  - ingress.yaml
