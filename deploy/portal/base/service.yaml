apiVersion: v1
kind: Service
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
  annotations:
    # Container-native load balancing: expose pod IPs as a NEG so the GCE Ingress
    # load-balances directly to pods.
    cloud.google.com/neg: '{"ingress": true}'
    # Attach the health-check / timeout policy for the Ingress backend.
    cloud.google.com/backend-config: '{"default": "portal-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portal
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
