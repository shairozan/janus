apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal
  labels:
    app.kubernetes.io/name: portal
  annotations:
    # External GCE (GCLB) Ingress. No reserved static IP: external-dns publishes
    # the record to whatever address the LB is assigned.
    kubernetes.io/ingress.class: "gce"
    # The cluster-wide januspk.com external-dns instance (deployed alongside the
    # license-server, domain-filter=januspk.com, watching all ingresses) creates
    # this hostname in Cloudflare — no second external-dns instance is needed.
    external-dns.alpha.kubernetes.io/hostname: "app.januspk.com"
    # Redirect HTTP->HTTPS at the load balancer.
    networking.gke.io/v1beta1.FrontendConfig: "portal-frontendconfig"
spec:
  # TLS material is issued by cert-manager (DNS-01 via Cloudflare) into this
  # Secret; the GCE Ingress provisions an LB SSL certificate from it.
  tls:
    - hosts:
        - app.januspk.com
      secretName: portal-tls
  rules:
    - host: app.januspk.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal
                port:
                  number: 80
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: portal-frontendconfig
  labels:
    app.kubernetes.io/name: portal
spec:
  redirectToHttps:
    enabled: true
