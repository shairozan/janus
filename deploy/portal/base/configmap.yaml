apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-config
  labels:
    app.kubernetes.io/name: portal
data:
  # Non-secret runtime configuration. The secrets (AUTH_SECRET, the Cognito
  # client secret) live in the SOPS-encrypted Secret, not here.

  # The standalone Next server listens on 3000 (matches docker/portal/Dockerfile).
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  NEXT_TELEMETRY_DISABLED: "1"

  # Auth.js trusts the X-Forwarded-* headers from the GCLB (TLS terminates there).
  AUTH_TRUST_HOST: "true"

  # Environment-specific values are provided by each overlay via a ConfigMap
  # patch (overlays/gke/portal-config-patch.yaml), since they differ per cluster:
  #   AUTH_URL              — the portal's public origin (https://app.januspk.com)
  #   AUTH_COGNITO_ID       — the portal's Cognito app client id (non-secret)
  #   AUTH_COGNITO_ISSUER   — the Cognito user-pool issuer URL (public)
  #   LICENSE_SERVER_URL    — in-cluster URL of the license-server BFF target
